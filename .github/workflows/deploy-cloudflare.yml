
name: Deploy to Cloudflare Workers

# Deploy the current branch of this Fork.
# Manual runs via the Actions UI are also supported.

on:
  workflow_call:
  workflow_dispatch:

# Prevent overlapping deployments.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Checkout this Fork and the branch that triggered the workflow.
      - name: Checkout Fork
        uses: actions/checkout@v6

      # Check required Cloudflare credentials.
      - name: Check required secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing required secrets."
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi

      # Read version from this Fork's package.json.
      - name: Resolve version from Fork package
        id: release
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")

          if [ -z "$VERSION" ]; then
            echo "::error::Cannot read version from package.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Deploying Fork version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Create or reuse Cloudflare D1 database.
      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name == "zpan-db") | .uuid')

          if [ -z "$DB_ID" ]; then
            DB_ID=$(pnpm exec wrangler d1 create zpan-db | awk -F'"' '/database_id/{print $2; exit}')
            echo "Created D1 database: $DB_ID"
          else
            echo "Reusing D1 database: $DB_ID"
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::Failed to obtain D1 database UUID"
            exit 1
          fi

          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"

      # Create or reuse Cloudflare KV namespace.
      - name: Ensure cache KV namespace exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID=$(pnpm exec wrangler kv namespace list | jq -r '.[] | select(.title == "zpan-cache") | .id')

          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl --fail-with-body -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"zpan-cache"}' | jq -er '.result.id')
          fi

          if [[ ! "$KV_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Failed to obtain cache KV namespace ID."
            exit 1
          fi

          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"

      # Update production CACHE_KV binding.
      - name: Patch production cache KV binding
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("wrangler.toml")
          config = path.read_text()

          pattern = r'(\[\[kv_namespaces\]\]\s*binding = "CACHE_KV"\s*id = ")[^"]*(")'

          config, count = re.subn(
              pattern,
              lambda match: match[1] + os.environ["KV_ID"] + match[2],
              config
          )

          if count != 1:
              raise SystemExit("Expected exactly one production CACHE_KV binding")

          path.write_text(config)
          PYTHON

      # Create or reuse Cloudflare Queue.
      - name: Ensure Queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(pnpm exec wrangler queues create zpan-archive-jobs 2>&1) || true

          if echo "$OUTPUT" | grep -qi "already taken"; then
            echo "Queue already exists, skipping"
          elif echo "$OUTPUT" | grep -q "ERROR"; then
            echo "$OUTPUT"
            exit 1
          else
            echo "Created queue: zpan-archive-jobs"
          fi

      # No Cloudflare R2 resources are created or configured here.
      # Avatar storage must be migrated to Backblaze B2 in application code.

      # Update D1 database ID in wrangler.toml.
      - name: Patch wrangler.toml with D1 database ID
        env:
          D1_ID: ${{ steps.d1.outputs.id }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("wrangler.toml")
          config = path.read_text()

          pattern = r'(database_id\s*=\s*")[^"]*(")'

          config, count = re.subn(
              pattern,
              lambda match: match[1] + os.environ["D1_ID"] + match[2],
              config,
              count=1
          )

          if count != 1:
              raise SystemExit("Expected exactly one D1 database_id")

          path.write_text(config)
          PYTHON

      # Set Better Auth secret.
      - name: Set BETTER_AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USER_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          EXISTS=$(pnpm exec wrangler secret list --format json | jq -r '.[] | select(.name == "BETTER_AUTH_SECRET") | .name')

          if [ -n "$USER_SECRET" ]; then
            echo "$USER_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET
            echo "Set BETTER_AUTH_SECRET from GitHub secret"
          elif [ -z "$EXISTS" ]; then
            openssl rand -base64 32 | pnpm exec wrangler secret put BETTER_AUTH_SECRET
            echo "Generated BETTER_AUTH_SECRET"
          else
            echo "BETTER_AUTH_SECRET already exists, skipping"
          fi

      # Build the application.
      - name: Build
        env:
          ZPAN_APP_VERSION: ${{ steps.release.outputs.version }}
          ZPAN_APP_COMMIT: ${{ github.sha }}
        run: pnpm build

      # Deploy to Cloudflare Workers.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      # Clear previous WebDAV domain verification.
      - name: Clear WebDAV domain readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute zpan-db --remote --command \
            "INSERT INTO system_options (key, value) VALUES ('webdav_verified_origin', ''), ('webdav_verified_at', ''), ('webdav_verification_error', '') ON CONFLICT(key) DO UPDATE SET value = excluded.value"

      # Synchronize WebDAV domain.
      - name: Reconcile fixed WebDAV domain
        id: webdav
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(node scripts/sync-cloudflare-webdav.mjs)
          echo "$OUTPUT"
          printf '%s\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      # Record WebDAV domain verification.
      - name: Record WebDAV domain readiness
        if: steps.webdav.outputs.origin != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBDAV_ORIGIN: ${{ steps.webdav.outputs.origin }}
        run: |
          if [[ ! "$WEBDAV_ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid WebDAV origin returned by deployment sync"
            exit 1
          fi

          VERIFIED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')

          pnpm exec wrangler d1 execute zpan-db --remote --command \
            "INSERT INTO system_options (key, value) VALUES ('webdav_verified_origin', '$WEBDAV_ORIGIN'), ('webdav_verified_at', '$VERIFIED_AT'), ('webdav_verification_error', '') ON CONFLICT(key) DO UPDATE SET value = excluded.value"

          echo "WebDAV readiness recorded for $WEBDAV_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
