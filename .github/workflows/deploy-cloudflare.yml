
name: Deploy to Cloudflare Workers

on:
  workflow_call:
  workflow_dispatch:

# Prevent overlapping deployments.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Checkout the exact repository and branch that triggered this workflow.
      - name: Checkout B2-enabled repository
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Create or reuse the production D1 database.
      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          DB_ID=$(pnpm exec wrangler d1 list --json \
            | jq -r '.[] | select(.name == "zpan-db") | .uuid' \
            | head -n 1)

          if [ -z "$DB_ID" ]; then
            OUTPUT=$(pnpm exec wrangler d1 create zpan-db 2>&1)
            echo "$OUTPUT"
            DB_ID=$(printf '%s\n' "$OUTPUT" \
              | sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              | head -n 1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::Failed to obtain D1 database ID."
            exit 1
          fi

          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Production D1 database ID obtained."

      # Create or reuse the production KV namespace.
      - name: Ensure cache KV namespace exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          KV_ID=$(pnpm exec wrangler kv namespace list \
            | jq -r '.[] | select(.title == "zpan-cache") | .id' \
            | head -n 1)

          if [ -z "$KV_ID" ]; then
            KV_ID=$(curl --fail-with-body -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"zpan-cache"}' \
              | jq -er '.result.id')
          fi

          if [[ ! "$KV_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Invalid KV namespace ID."
            exit 1
          fi

          echo "id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "Production KV namespace ID obtained."

      # Update only the production CACHE_KV binding.
      - name: Patch production cache KV binding
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("wrangler.toml")
          config = path.read_text()

          pattern = (
              r'(\[\[kv_namespaces\]\]\s*'
              r'binding\s*=\s*"CACHE_KV"\s*'
              r'id\s*=\s*")[^"]*(")'
          )

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + os.environ["KV_ID"] + m.group(2),
              config,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one production CACHE_KV binding."
              )

          path.write_text(updated)
          print("Production CACHE_KV binding updated.")
          PYTHON

      # Update only the production D1 database ID.
      # Preview database IDs remain untouched.
      - name: Patch production D1 database binding
        env:
          DB_ID: ${{ steps.d1.outputs.id }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("wrangler.toml")
          config = path.read_text()

          marker = "\n[previews]"
          if marker not in config:
              raise SystemExit("Preview configuration not found.")

          production, preview = config.split(marker, 1)

          pattern = (
              r'(\[\[d1_databases\]\]\s*'
              r'binding\s*=\s*"DB"\s*'
              r'database_name\s*=\s*"zpan-db"\s*'
              r'database_id\s*=\s*")[^"]*(")'
          )

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + os.environ["DB_ID"] + m.group(2),
              production,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Expected exactly one production zpan-db binding."
              )

          path.write_text(updated + marker + preview)
          print("Production D1 binding updated; Preview binding preserved.")
          PYTHON

      # Create or reuse the archive queue.
      - name: Ensure Queue exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          OUTPUT=$(pnpm exec wrangler queues create zpan-archive-jobs 2>&1) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -Eiq \
            "already exists|already taken|already in use"; then
            echo "Queue already exists; reusing it."
          elif echo "$OUTPUT" | grep -Eiq "error|failed"; then
            echo "::error::Failed to create or verify queue."
            exit 1
          else
            echo "Queue creation command completed."
          fi

      # Set authentication secret.
      - name: Ensure BETTER_AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USER_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail

          EXISTS=$(pnpm exec wrangler secret list --format json \
            | jq -r '.[] | select(.name == "BETTER_AUTH_SECRET") | .name')

          if [ -n "$USER_SECRET" ]; then
            printf '%s' "$USER_SECRET" \
              | pnpm exec wrangler secret put BETTER_AUTH_SECRET
            echo "BETTER_AUTH_SECRET configured from GitHub Secrets."
          elif [ -z "$EXISTS" ]; then
            openssl rand -base64 32 \
              | pnpm exec wrangler secret put BETTER_AUTH_SECRET
            echo "BETTER_AUTH_SECRET generated."
          else
            echo "Existing BETTER_AUTH_SECRET preserved."
          fi

      # Build the current B2-enabled branch.
      - name: Build
        env:
          ZPAN_APP_VERSION: ${{ github.ref_name }}
          ZPAN_APP_COMMIT: ${{ github.sha }}
        run: pnpm build

      # Deploy the Worker and apply production D1 migrations.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      # Reset stale WebDAV verification state.
      - name: Clear WebDAV domain readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          pnpm exec wrangler d1 execute zpan-db --remote --command \
            "INSERT INTO system_options (key, value) VALUES ('webdav_verified_origin', ''), ('webdav_verified_at', ''), ('webdav_verification_error', '') ON CONFLICT(key) DO UPDATE SET value = excluded.value"

      # Reconcile the WebDAV domain.
      - name: Reconcile fixed WebDAV domain
        id: webdav
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          OUTPUT=$(node scripts/sync-cloudflare-webdav.mjs)
          echo "$OUTPUT"
          printf '%s\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      # Record WebDAV verification state.
      - name: Record WebDAV domain readiness
        if: steps.webdav.outputs.origin != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBDAV_ORIGIN: ${{ steps.webdav.outputs.origin }}
        run: |
          set -euo pipefail

          if [[ ! "$WEBDAV_ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid WebDAV origin."
            exit 1
          fi

          VERIFIED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')

          pnpm exec wrangler d1 execute zpan-db --remote --command \
            "INSERT INTO system_options (key, value) VALUES ('webdav_verified_origin', '$WEBDAV_ORIGIN'), ('webdav_verified_at', '$VERIFIED_AT'), ('webdav_verification_error', '') ON CONFLICT(key) DO UPDATE SET value = excluded.value"

          echo "WebDAV readiness recorded." >> "$GITHUB_STEP_SUMMARY"
